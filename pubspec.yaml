name: stayhunter
description: "StayHunter — помощник по прибытии: карта, поиск, объекты рядом."
publish_to: "none"
version: 0.6.1+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pois_moscow.json
    - assets/pois_istanbul.json
