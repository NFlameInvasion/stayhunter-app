name: APK

# Сборка APK на машине GitHub. На сервере владельца ничего не собирается:
# он только скачивает готовый файл по постоянной ссылке из релиза.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Каркас Android создаётся здесь же: в репозитории лежит только то, что
      # относится к приложению, без сгенерированных Gradle-файлов.
      - name: Каркас Android
        run: flutter create --platforms=android --org ru.nflame --project-name stayhunter .

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "ключ подписи распакован"
          else
            echo "ключа нет — сборка с отладочной подписью"
          fi

      - name: Разрешения и подпись
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/patch_android.py

      - name: Зависимости
        run: flutter pub get

      - name: Проверка кода
        run: flutter analyze

      - name: Сборка
        run: flutter build apk --release

      - name: Выложить в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk stayhunter.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "StayHunter — сборка" --notes "Автоматическая сборка из ветки main."
          gh release upload latest stayhunter.apk --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/latest/stayhunter.apk"
