name: APK

# Сборка APK на машине GitHub. На сервере владельца ничего не собирается:
# он только скачивает готовый файл по постоянной ссылке из релиза.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Каркас Android создаётся здесь же: в репозитории лежит только то, что
      # относится к приложению, без сгенерированных Gradle-файлов.
      - name: Каркас Android
        run: flutter create --platforms=android --org ru.nflame --project-name stayhunter .

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "ключ подписи распакован"
          else
            echo "ключа нет — сборка с отладочной подписью"
          fi

      - name: Разрешения и подпись
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f android/app/keystore.jks ]; then export KEYSTORE_PATH=keystore.jks; fi
          python3 tools/patch_android.py

      - name: Зависимости
        run: flutter pub get

      - name: Проверка кода
        run: flutter analyze

      - name: Проверки данных
        run: flutter test

      - name: Сборка
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Проверка подписи
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -4

      - name: Выложить в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk stayhunter.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk stayhunter-32.apk
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "StayHunter — сборка" --notes "Автоматическая сборка из ветки main."
          fi
          gh release upload latest stayhunter.apk stayhunter-32.apk --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/latest/stayhunter.apk"
